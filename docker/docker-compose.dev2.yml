services:
  postgres:
    image: postgres:14-alpine
    container_name: platform-postgres-dev2
    environment:
      POSTGRES_USER: platform_user
      POSTGRES_PASSWORD: platform_password
      POSTGRES_DB: platform_db
    ports:
      - "5434:5432"
    volumes:
      - postgres-data-dev2:/var/lib/postgresql/data
    networks:
      - platform-net-dev2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_user -d platform_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: platform-redis-dev2
    ports:
      - "6380:6379"
    networks:
      - platform-net-dev2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: api-dev2
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: platform_user
      DB_PASSWORD: platform_password
      DB_NAME: platform_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_PORT: 4000
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      GEMINI_KEY: ${GEMINI_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
    ports:
      - "4002:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - platform-net-dev2
    volumes:
      - ../api:/app
      - /app/node_modules

  webapp:
    build:
      context: ../webapp
      dockerfile: Dockerfile
    container_name: webapp-dev2
    environment:
      - VITE_DOCKER=true
      - VITE_API_URL=/api
      - VITE_WS_URL=ws://localhost:4002
      - VITE_SENTRY_DSN=${SENTRY_DSN}
    ports:
      - "3002:3000"
    depends_on:
      - api
    networks:
      - platform-net-dev2
    volumes:
      - ../webapp:/app
      - /app/node_modules

  bot-worker:
    build:
      context: ../bot
      dockerfile: Dockerfile
    container_name: bot-worker-dev2
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: platform_user
      DB_PASSWORD: platform_password
      DB_NAME: platform_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GEMINI_KEY: ${GEMINI_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - platform-net-dev2
    volumes:
      - ../bot:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  postgres-data-dev2:

networks:
  platform-net-dev2:
    driver: bridge
