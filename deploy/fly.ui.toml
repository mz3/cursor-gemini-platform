# fly.toml for cursor-gemini-webapp (UI service only)
# Updated for hybrid approach

app = 'cursor-gemini-webapp'
primary_region = 'sea'

[build]
  dockerfile = '../docker/Dockerfile.ui'

[deploy]
  strategy = 'rolling'
  max_unavailable = 1.0

[env]
  NODE_ENV = 'production'
  REACT_APP_API_URL = 'https://cursor-gemini-api.fly.dev'

[processes]
  app = "nginx -g 'daemon off;'"

[[services]]
  protocol = 'tcp'
  internal_port = 3000
  processes = ['app']

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '1s'

# Scaling configuration - Free tier: 1 VM
[scale]
  min = 1
  max = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[[metrics]]
  port = 9091
  path = '/metrics'
