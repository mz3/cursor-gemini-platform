# fly.toml for cursor-gemini-api (API service only)
# Updated for hybrid approach with managed PostgreSQL and Redis

app = "cursor-gemini-api"
primary_region = "sea"

[build]
  dockerfile = "../docker/Dockerfile.api"

[processes]
  app = "npm start"

[env]
  NODE_ENV = "production"

  # Database configuration - Using Fly's managed PostgreSQL
  DB_HOST = "meta-platform-mz3.internal"
  DB_PORT = "5432"
  DB_NAME = "postgres"
  DB_USER = "postgres"
  # DB_PASSWORD will be set via fly secrets

  # Redis configuration - Using Fly's managed Redis (Upstash)
  REDIS_HOST = "fly-meta-platform-redis.upstash.io"
  REDIS_PORT = "6379"
  # REDIS_PASSWORD will be set via fly secrets

  # JWT configuration
  JWT_SECRET = "your-jwt-secret-key"
  JWT_EXPIRES_IN = "24h"

  # API configuration
  API_PORT = "4000"
  API_URL = "https://cursor-gemini-api.fly.dev"

  # Gemini configuration
  # GEMINI_KEY will be set via fly secrets

[[services]]
  processes = ["app"]
  internal_port = 4000
  protocol = "tcp"

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
    type = "connections"

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "1s"
    restart_limit = 0

[deploy]
  strategy = "rolling"
  max_unavailable = 1

[metrics]
  port = 9091
  path = "/metrics"

# Scaling configuration - Free tier: 1 VM
[scale]
  min = 1
  max = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
